name: Prepare pinned NetOps release
on:
  push:
    branches: [release/promote-f518888-20261107]
permissions:
  contents: write
jobs:
  prepare:
    if: "!startsWith(github.event.head_commit.message, 'release: promote pinned staging')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned upstream source
        run: |
          set -euo pipefail
          git clone -q https://github.com/apotet/my-gemini-mirror-site.git /tmp/netops-upstream
          git -C /tmp/netops-upstream checkout -q --detach f51888882309184e3d3a97204687f54a363d42fb
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          root=pathlib.Path.cwd()
          up=pathlib.Path('/tmp/netops-upstream')
          source_sha='f51888882309184e3d3a97204687f54a363d42fb'
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=up,text=True).strip()==source_sha
          old=json.loads((root/'release/source-files.json').read_text())
          def included(p):
              return not p.startswith(('assets/','.github/','release/','dist/','node_modules/','.env')) and p not in ('RELEASE_SOURCE.md','RELEASING.md')
          raw=subprocess.check_output(['git','ls-tree','-r','-z','HEAD'],cwd=up)
          chosen={}
          for item in raw.split(b'\0'):
              if not item: continue
              head,name=item.split(b'\t',1)
              mode,typ,blob=head.decode().split()
              p=name.decode()
              if included(p):
                  assert typ=='blob' and mode in ('100644','100755'), (p,mode)
                  chosen[p]=blob
          assert len(chosen)>=70, 'Incomplete source inventory'
          for item in old['files']:
              if item['path'] not in chosen:
                  p=root/item['path']
                  if p.is_file(): p.unlink()
          for p,blob in chosen.items():
              dest=root/p
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(up/p,dest)
              actual=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert actual==blob, p
          manifest={'upstream':'apotet/my-gemini-mirror-site','source_sha':source_sha,'files':[{'path':p,'sha':chosen[p]} for p in sorted(chosen)]}
          (root/'release/source-files.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          oldnotes=(root/'RELEASE_SOURCE.md').read_text().replace('# NetOps production release — N0','# NetOps production release — N0 (historical)',1)
          (root/'RELEASE_SOURCE.md').write_text(
              '# NetOps production release — N1\n\n'
              '- Upstream: https://github.com/apotet/my-gemini-mirror-site\n'
              '- Pinned source SHA: '+source_sha+'\n'
              '- Production URL: https://apotet.github.io/netops/\n'
              '- Imported product files: '+str(len(chosen))+' exact Git blobs in release/source-files.json.\n'
              '- Build: Node 22; npm ci; Vite --base=/netops/.\n'
              '- Production commit and workflow: /netops/release.json after deploy.\n'
              '- Excluded upstream assets/, environment files and workflows; retained NetOps release controls.\n\n'
              '---\n\n'+oldnotes)
          (root/'.github/workflows/prepare-promotion.yml').unlink()
          print('PASS: imported',len(chosen),'exact source blobs')
          PY
      - name: Push release candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "release: promote pinned staging f518888 to NetOps production candidate"
          git push origin HEAD:release/promote-f518888-20261107
