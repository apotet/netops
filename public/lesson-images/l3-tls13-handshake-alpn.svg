<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
  <defs>
    <style>
      .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #94a3b8; }
      .sec-title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e2e8f0; }
      .label { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #f1f5f9; }
      .text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #cbd5e1; }
      .muted { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #e2e8f0; }
      .mono-sm { font-family: 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 400; fill: #cbd5e1; }
      .badge { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1100" height="680" rx="16" fill="#0f172a"/>
  <text x="36" y="44" class="title">TLS 1.3 Handshake (1-RTT): проверка сертификата, SAN и согласование ALPN</text>
  <text x="36" y="66" class="subtitle">Полное рукопожатие без PSK и 0-RTT: когда клиент имеет право отправить HTTP/2-запрос поверх TLS</text>

  <!-- Left panel: Sequence Diagram -->
  <rect x="36" y="92" width="664" height="556" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="74" y="112" width="174" height="38" rx="8" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="161" y="136" text-anchor="middle" class="label">Клиент (Browser/CLI)</text>
  <rect x="492" y="112" width="166" height="38" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="575" y="136" text-anchor="middle" class="label">Сервер (HTTPS)</text>

  <!-- Lifelines -->
  <line x1="161" y1="150" x2="161" y2="626" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="575" y1="150" x2="575" y2="626" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Step 0: TCP -->
  <rect x="260" y="162" width="216" height="26" rx="13" fill="#0f172a" stroke="#64748b"/>
  <text x="368" y="179" text-anchor="middle" class="muted">TCP 3-way handshake завершён</text>

  <!-- Step 1: ClientHello -->
  <line x1="166" y1="214" x2="566" y2="214" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <text x="180" y="206" class="mono-sm" fill="#38bdf8">1. ClientHello: SNI=b.example.test, ALPN=["h2","http/1.1"], key_share</text>

  <!-- Step 2: ServerHello + Encrypted Flight -->
  <line x1="570" y1="262" x2="170" y2="262" stroke="#34d399" stroke-width="2.2" marker-end="url(#arr-emerald)"/>
  <text x="180" y="254" class="mono-sm" fill="#34d399">2. ServerHello (выбран шифр + key_share сервера)</text>

  <rect x="192" y="276" width="372" height="128" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="214" y="298" class="label" fill="#c4b5fd">Зашифрованный блок сервера (Handshake):</text>
  <text x="214" y="318" class="mono-sm">• EncryptedExtensions  →  ALPN выбран: "h2"</text>
  <text x="214" y="338" class="mono-sm">• Certificate          →  цепочка X.509 + SAN</text>
  <text x="214" y="358" class="mono-sm">• CertificateVerify    →  подпись приватным ключом</text>
  <text x="214" y="378" class="mono-sm">• Finished             →  MAC всего транскрипта</text>
  <line x1="570" y1="340" x2="556" y2="340" stroke="#a78bfa" stroke-width="2"/>
  <line x1="200" y1="340" x2="170" y2="340" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr-violet)"/>

  <!-- Step 3: Client verification box -->
  <rect x="58" y="420" width="248" height="84" rx="8" fill="#172554" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="72" y="440" class="label" fill="#fde68a">Проверки клиента ДО данных:</text>
  <text x="72" y="458" class="text">1. Цепочка CA, срок и SAN</text>
  <text x="72" y="475" class="text">2. Подпись CertificateVerify</text>
  <text x="72" y="492" class="text">3. MAC в серверном Finished</text>

  <!-- Step 4: Client Finished -->
  <line x1="166" y1="536" x2="566" y2="536" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arr-amber)"/>
  <text x="180" y="528" class="mono-sm" fill="#fde68a">3. Клиент отправляет собственный {Finished}</text>

  <!-- Step 5: Application Data -->
  <line x1="166" y1="588" x2="566" y2="588" stroke="#34d399" stroke-width="2.6" marker-end="url(#arr-emerald)"/>
  <rect x="196" y="564" width="356" height="48" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="374" y="584" text-anchor="middle" class="label" fill="#6ee7b7">4. Прикладные данные (Application Data)</text>
  <text x="374" y="602" text-anchor="middle" class="mono-sm">ALPN="h2" → HTTP/2 connection preface + кадры</text>

  <!-- Right Panel: Key Rules (SNI, SAN, ALPN) -->
  <rect x="722" y="92" width="342" height="172" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="742" y="120" class="sec-title" fill="#38bdf8">1. SNI: выбор сертификата на 1 IP</text>
  <text x="742" y="144" class="text">На одном IP живут a.example.test и b.example.test.</text>
  <text x="742" y="164" class="text">HTTP-заголовок Host передаётся только после</text>
  <text x="742" y="182" class="text">установления TLS; до этого нужен SNI.</text>
  <rect x="742" y="196" width="302" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="754" y="216" class="mono-sm" fill="#7dd3fc">ClientHello (SNI: b.example.test)</text>
  <text x="754" y="234" class="muted">→ сервер сразу отдаёт сертификат для b</text>

  <rect x="722" y="282" width="342" height="178" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="742" y="310" class="sec-title" fill="#fde68a">2. SAN и правило Wildcard (*)</text>
  <text x="742" y="332" class="mono-sm">SAN: DNS:*.example.test, DNS:api.example.net</text>
  <rect x="742" y="346" width="302" height="44" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="754" y="365" class="mono-sm" fill="#6ee7b7">[OK] api.example.net — PASS</text>
  <text x="754" y="381" class="muted">Точное совпадение со вторым SAN</text>
  <rect x="742" y="398" width="302" height="48" rx="8" fill="#4c0519" stroke="#fb7185"/>
  <text x="754" y="417" class="mono-sm" fill="#fda4af">[NO] shop.dev.example.test — FAIL</text>
  <text x="754" y="434" class="muted">Звёздочка * закрывает только 1 уровень!</text>

  <rect x="722" y="478" width="342" height="170" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
  <text x="742" y="506" class="sec-title" fill="#34d399">3. ALPN (RFC 7301): сразу в HTTP/2</text>
  <text x="742" y="530" class="text">Если сервер выбрал ALPN "h2", клиент НЕ шлёт</text>
  <text x="742" y="548" class="text">текстовый GET / HTTP/1.1 и НЕ шлёт Upgrade: h2c.</text>
  <rect x="742" y="564" width="302" height="66" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="754" y="584" class="mono-sm" fill="#6ee7b7">PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n</text>
  <text x="754" y="602" class="text">+ бинарные кадры SETTINGS / HEADERS</text>
  <text x="754" y="618" class="muted">Никаких лишних RTT на переключение</text>
</svg>
