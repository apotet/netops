<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1540" width="820" height="1540" role="img" aria-labelledby="title desc">
<title id="title">Шпаргалка PoE: контакты и цвета жил</title>
<desc id="desc">Mode A использует контакты 1–2 и 3–6, Mode B использует 4–5 и 7–8, четырёхпарный PoE использует оба набора. Показаны цвета T568B и отличие T568A.</desc>
<rect width="820" height="1540" fill="#06111d" rx="28"/>
<rect x="20" y="20" width="780" height="1500" fill="#0b1b2b" stroke="#20526b" stroke-width="2" rx="24"/>
<g font-family="Arial, 'DejaVu Sans', sans-serif">
<text x="48" y="84" font-size="43" font-weight="700" fill="#e2f7ff">КАКИЕ ЖИЛЫ ПИТАЮТ PoE?</text>
<text x="48" y="127" font-size="25" fill="#9dbfd2">Сначала контакты RJ-45, затем цвета проводов</text>

<rect x="45" y="156" width="730" height="327" rx="22" fill="#102c3b" stroke="#16798a" stroke-width="2"/>
<rect x="45" y="156" width="9" height="327" rx="5" fill="#32d1de"/>
<text x="76" y="207" font-size="38" font-weight="700" fill="#94faff">MODE A</text>
<text x="76" y="242" font-size="26" fill="#d1edf7">Контакты 1–2 и 3–6</text>
<text x="76" y="279" font-size="22" fill="#a3bac8">Для T568B:</text>
<text x="78" y="324" font-size="29" fill="#a9e7fa" font-weight="700">1, 2</text><rect x="214" y="301" width="54" height="22" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><path d="M218 314L235 304M235 320L259 305" stroke="#f58b35" stroke-width="6"/><text x="282" y="320" fill="#e5f5ff" font-size="26">бело-оранж.</text><rect x="504" y="301" width="54" height="22" rx="6" fill="#f58b35" stroke="#94a3b8" stroke-width="1.5"/><text x="572" y="320" fill="#e5f5ff" font-size="26">оранжевая</text>
<text x="78" y="390" font-size="29" fill="#a9e7fa" font-weight="700">3, 6</text><rect x="214" y="367" width="54" height="22" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><path d="M218 380L235 370M235 386L259 371" stroke="#31ae73" stroke-width="6"/><text x="282" y="386" fill="#e5f5ff" font-size="26">бело-зелёная</text><rect x="504" y="367" width="54" height="22" rx="6" fill="#31ae73" stroke="#94a3b8" stroke-width="1.5"/><text x="572" y="386" fill="#e5f5ff" font-size="26">зелёная</text>
<text x="76" y="459" font-size="23" fill="#aee1f1">Для T568A: оранжевая и зелёная меняются местами.</text>

<rect x="45" y="502" width="730" height="327" rx="22" fill="#17293f" stroke="#4b87bc" stroke-width="2"/>
<rect x="45" y="502" width="9" height="327" rx="5" fill="#7cbfff"/>
<text x="76" y="553" font-size="38" font-weight="700" fill="#bddfff">MODE B</text>
<text x="76" y="588" font-size="26" fill="#d1edf7">Контакты 4–5 и 7–8</text>
<text x="76" y="625" font-size="22" fill="#a3bac8">Одинаково для T568A и T568B:</text>
<text x="78" y="670" font-size="29" fill="#a9e7fa" font-weight="700">4, 5</text><rect x="214" y="647" width="54" height="22" rx="6" fill="#347cda" stroke="#94a3b8" stroke-width="1.5"/><text x="282" y="666" fill="#e5f5ff" font-size="26">синяя</text><rect x="504" y="647" width="54" height="22" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><path d="M508 660L525 650M525 666L549 651" stroke="#347cda" stroke-width="6"/><text x="572" y="666" fill="#e5f5ff" font-size="26">бело-синяя</text>
<text x="78" y="736" font-size="29" fill="#a9e7fa" font-weight="700">7, 8</text><rect x="214" y="713" width="54" height="22" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><path d="M218 726L235 716M235 732L259 717" stroke="#9a6b45" stroke-width="6"/><text x="282" y="732" fill="#e5f5ff" font-size="26">бело-корич.</text><rect x="504" y="713" width="54" height="22" rx="6" fill="#9a6b45" stroke="#94a3b8" stroke-width="1.5"/><text x="572" y="732" fill="#e5f5ff" font-size="26">коричневая</text>
<text x="76" y="805" font-size="23" fill="#aee1f1">При 10/100 Мбит/с эти пары не нужны для данных.</text>

<rect x="45" y="850" width="730" height="133" rx="22" fill="#193739" stroke="#37b9a7" stroke-width="2"/>
<text x="75" y="899" font-size="34" font-weight="700" fill="#9cf3dd">4-парный PoE (802.3bt)</text>
<text x="75" y="941" font-size="26" fill="#d7f7eb">Mode A + Mode B → все 8 контактов</text>
<text x="75" y="968" font-size="20" fill="#a5cbc5">Данные 1000BASE-T тоже идут по всем 4 парам.</text>

<rect x="45" y="1005" width="730" height="268" rx="22" fill="#11273e" stroke="#3b647e" stroke-width="2"/>
<text x="75" y="1052" font-size="32" font-weight="700" fill="#e6f5ff">Отличие обжима T568A / T568B</text>
<text x="75" y="1095" font-size="24" fill="#8cbbce">Контакты</text>
<text x="285" y="1095" font-size="24" fill="#8cbbce">T568A</text>
<text x="515" y="1095" font-size="24" fill="#8cbbce">T568B</text>
<path d="M75 1108H740" stroke="#325772" stroke-width="2"/>
<text x="75" y="1144" fill="#daf3ff" font-size="25">1–2</text>
<text x="285" y="1144" fill="#daf3ff" font-size="25">зелёная</text>
<text x="515" y="1144" fill="#daf3ff" font-size="25">оранжевая</text>
<text x="75" y="1174" fill="#daf3ff" font-size="25">3–6</text>
<text x="285" y="1174" fill="#daf3ff" font-size="25">оранжевая</text>
<text x="515" y="1174" fill="#daf3ff" font-size="25">зелёная</text>
<text x="75" y="1204" fill="#daf3ff" font-size="25">4–5</text>
<text x="285" y="1204" fill="#daf3ff" font-size="25">синяя</text>
<text x="515" y="1204" fill="#daf3ff" font-size="25">синяя</text>
<text x="75" y="1234" fill="#daf3ff" font-size="25">7–8</text>
<text x="285" y="1234" fill="#daf3ff" font-size="25">коричневая</text>
<text x="515" y="1234" fill="#daf3ff" font-size="25">коричневая</text>

<rect x="45" y="1293" width="730" height="200" rx="22" fill="#203044" stroke="#e3a848" stroke-width="2"/>
<text x="75" y="1338" font-size="30" fill="#ffdfa6" font-weight="700">НЕ ПУТАЙ!</text>
<text x="75" y="1373" font-size="24" fill="#f3f6fb">Mode A/B — способ подачи PoE.</text>
<text x="75" y="1407" font-size="24" fill="#f3f6fb">T568A/B — порядок цветов при обжиме.</text>
<text x="75" y="1441" font-size="23" fill="#c7d5e5">4 жилы: возможен 100 Мбит/с и Mode A,</text>
<text x="75" y="1469" font-size="23" fill="#c7d5e5">но Mode B и гигабит не обеспечены.</text>
</g>
</svg>