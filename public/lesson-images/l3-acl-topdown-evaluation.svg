<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-labelledby="t5 d5">
<title id="t5">ACL: проверка сверху вниз, первое совпадение и implicit deny any</title>
<desc id="d5">Схема обработки пакета списком ACL сверху вниз до первого совпадения, неявный запрет в конце и направление in/out на интерфейсе маршрутизатора.</desc>
<defs><linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020b15"/><stop offset="1" stop-color="#081e2c"/></linearGradient></defs>
<rect width="860" height="540" rx="18" fill="url(#bg5)"/>
<text x="430" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#f1f8ff">ACL: проверка сверху вниз, первое совпадение и implicit deny</text>

<!-- Left: Top-down rules -->
<g transform="translate(24,58)" font-family="Arial,sans-serif">
  <rect x="0" y="0" width="466" height="456" rx="14" fill="#071a2b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="18" y="30" font-size="15.5" font-weight="800" fill="#7dd3fc">Порядок обработки правил (First-Match)</text>

  <rect x="20" y="48" width="426" height="54" rx="8" fill="#0d3b3e" stroke="#2dd4bf"/>
  <text x="34" y="72" font-size="13.5" font-weight="800" fill="#ccfbf1">10: permit tcp 10.10.1.5 0.0.0.0 any eq 443</text>
  <text x="34" y="92" font-size="12" fill="#5eead4">Узкое правило (конкретный хост) → СТОП при совпадении</text>

  <rect x="20" y="116" width="426" height="54" rx="8" fill="#2c1218" stroke="#f87171"/>
  <text x="34" y="140" font-size="13.5" font-weight="800" fill="#fee2e2">20: deny tcp 10.10.1.0 0.0.0.255 any eq 443</text>
  <text x="34" y="160" font-size="12" fill="#fca5a5">Более широкое правило (подсеть) идёт ПОСЛЕ узкого</text>

  <rect x="20" y="184" width="426" height="54" rx="8" fill="#0c2f4d" stroke="#38bdf8"/>
  <text x="34" y="208" font-size="13.5" font-weight="800" fill="#e0f2fe">30: permit ip 10.10.1.0 0.0.0.255 any</text>
  <text x="34" y="228" font-size="12" fill="#7dd3fc">Разрешает остальной трафик подсети</text>

  <rect x="20" y="252" width="426" height="58" rx="8" fill="#450a0a" stroke="#ef4444" stroke-dasharray="6,3"/>
  <text x="34" y="276" font-size="13.5" font-weight="800" fill="#fecaca">[Неявное правило Cisco-like ACL]: deny any</text>
  <text x="34" y="297" font-size="12" fill="#fca5a5">В классическом интерфейсном ACL несовпавшее отбрасывается.</text>

  <rect x="20" y="328" width="426" height="108" rx="8" fill="#1b1224" stroke="#a78bfa"/>
  <text x="34" y="352" font-size="13.5" font-weight="800" fill="#ddd6fe">Типовые ловушки ACL:</text>
  <text x="34" y="376" font-size="12.5" fill="#e2e8f0">• Shadowing: широкое правило выше закрывает узкое ниже.</text>
  <text x="34" y="398" font-size="12.5" fill="#e2e8f0">• Без permit (если нужен пропуск) implicit deny отбросит всё.</text>
  <text x="34" y="420" font-size="12.5" fill="#e2e8f0">• Stateless ACL не знает обратный ответ без правила/stateful.</text>
</g>

<!-- Right: Direction in/out + Wildcard -->
<g transform="translate(508,58)" font-family="Arial,sans-serif">
  <rect x="0" y="0" width="328" height="220" rx="14" fill="#071e26" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="18" y="30" font-size="15.5" font-weight="800" fill="#5eead4">Направление IN и OUT</text>
  <rect x="94" y="64" width="140" height="68" rx="10" fill="#0b2438" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="164" y="102" text-anchor="middle" font-size="14.5" font-weight="800" fill="#f1f8ff">Маршрутизатор</text>
  <line x1="18" y1="98" x2="94" y2="98" stroke="#4ade80" stroke-width="3.5"/>
  <text x="56" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#4ade80">IN →</text>
  <line x1="234" y1="98" x2="310" y2="98" stroke="#fb923c" stroke-width="3.5"/>
  <text x="272" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#fdba74">→ OUT</text>
  <text x="18" y="162" font-size="12.5" fill="#cbd5e1">IN — до маршрутизации (вход в порт).</text>
  <text x="18" y="184" font-size="12.5" fill="#cbd5e1">OUT — после маршрутизации (выход).</text>
  <text x="18" y="206" font-size="12" fill="#94a3b8">Extended ACL ставят ближе к источнику.</text>

  <rect x="0" y="236" width="328" height="220" rx="14" fill="#091d2e" stroke="#fb923c" stroke-width="1.8"/>
  <text x="18" y="266" font-size="15.5" font-weight="800" fill="#fdba74">Wildcard-маска (0 = сверяй)</text>
  <text x="18" y="298" font-size="13" fill="#e2e8f0">• <tspan font-weight="700" fill="#7dd3fc">0.0.0.0</tspan> (host) = точный IP (/32)</text>
  <text x="18" y="326" font-size="13" fill="#e2e8f0">• <tspan font-weight="700" fill="#7dd3fc">0.0.0.255</tspan> = вся подсеть /24</text>
  <text x="18" y="354" font-size="13" fill="#e2e8f0">• <tspan font-weight="700" fill="#7dd3fc">0.0.3.255</tspan> = блок /22</text>
  <text x="18" y="382" font-size="13" fill="#e2e8f0">• <tspan font-weight="700" fill="#7dd3fc">255.255.255.255</tspan> = any</text>
  <text x="18" y="422" font-size="12" fill="#94a3b8">Формула: 255.255.255.255 − обычная маска.</text>
  <text x="18" y="440" font-size="12" fill="#94a3b8">В проверке смотри счётчики matches (hits).</text>
</g>
</svg>
