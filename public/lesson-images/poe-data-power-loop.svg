<svg xmlns="http://www.w3.org/2000/svg" width="860" height="720" viewBox="0 0 860 720" role="img" aria-labelledby="title desc">
<title id="title">PoE — данные и питание по одному кабелю</title>
<desc id="desc">Анимация: синие импульсы данных движутся от коммутатора к камере, точке Wi-Fi, VoIP-телефону и контроллеру доступа и обратно; оранжевые импульсы питания — только от коммутатора к устройствам. Ветви активируются по очереди.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020b15"/><stop offset="1" stop-color="#081e2c"/></linearGradient>
<filter id="blueGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="orangeGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="860" height="720" rx="20" fill="url(#bg)"/>
<text x="430" y="43" font-size="34" text-anchor="middle" fill="#f1f8ff" font-family="Arial,sans-serif" font-weight="800">Питание по Ethernet <tspan fill="#18c8ff">(PoE)</tspan></text>
<text x="430" y="75" font-size="19" text-anchor="middle" fill="#cad5e3" font-family="Arial,sans-serif">Один кабель: <tspan fill="#31c6ff">данные</tspan> + <tspan fill="#ff9938">питание</tspan></text>
