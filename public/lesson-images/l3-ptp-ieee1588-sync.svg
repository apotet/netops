<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-labelledby="t4 d4">
<title id="t4">PTP (IEEE 1588): иерархия часов и расчёт смещения по 4 меткам времени</title>
<desc id="d4">Схема Grandmaster -> Boundary/Transparent Clock -> Ordinary Clock и четырёхшаговый обмен Sync, Follow_Up, Delay_Req, Delay_Resp с метками t1, t2, t3, t4.</desc>
<defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020b15"/><stop offset="1" stop-color="#081e2c"/></linearGradient></defs>
<rect width="860" height="540" rx="18" fill="url(#bg4)"/>
<text x="430" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#f1f8ff">PTP (IEEE 1588): иерархия часов и 4 метки времени (t1–t4)</text>

<!-- Left: Clock Hierarchy -->
<g transform="translate(24,58)" font-family="Arial,sans-serif">
  <rect x="0" y="0" width="356" height="456" rx="14" fill="#071a2b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="18" y="30" font-size="15.5" font-weight="800" fill="#7dd3fc">Иерархия и роли часов (BMCA)</text>

  <rect x="28" y="50" width="300" height="68" rx="10" fill="#0c2f4d" stroke="#fb923c" stroke-width="1.8"/>
  <text x="178" y="78" text-anchor="middle" font-size="14.5" font-weight="800" fill="#ffedd5">Grandmaster Clock (GM)</text>
  <text x="178" y="100" text-anchor="middle" font-size="12" fill="#fdba74">Эталон времени (GNSS/GPS, выбор по BMCA)</text>

  <line x1="178" y1="118" x2="178" y2="152" stroke="#38bdf8" stroke-width="3"/>

  <rect x="28" y="152" width="300" height="84" rx="10" fill="#0d3b3e" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="178" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#ccfbf1">Boundary Clock (BC) /</text>
  <text x="178" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#ccfbf1">Transparent Clock (TC)</text>
  <text x="178" y="220" text-anchor="middle" font-size="11.5" fill="#5eead4">Учитывает задержку прохождения (residence time)</text>

  <line x1="178" y1="236" x2="178" y2="270" stroke="#38bdf8" stroke-width="3"/>

  <rect x="28" y="270" width="300" height="68" rx="10" fill="#0b2438" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="178" y="298" text-anchor="middle" font-size="14.5" font-weight="800" fill="#f1f8ff">Ordinary Clock (Slave / Follower)</text>
  <text x="178" y="320" text-anchor="middle" font-size="12" fill="#94a3b8">Реле РЗА, ПЛК, базовая станция, сервер</text>

  <rect x="20" y="356" width="316" height="84" rx="8" fill="#1e0b10" stroke="#ef4444" stroke-width="1.2"/>
  <text x="32" y="378" font-size="12.5" font-weight="800" fill="#fecaca">Метки HW/SW и 1-step E2E TC:</text>
  <text x="32" y="398" font-size="12" fill="#fca5a5">HW-метки точнее SW-меток ОС (PDV/джиттер).</text>
  <text x="32" y="416" font-size="12" fill="#fca5a5">1-step E2E TC: 1,2 + 0,8 = 2,0 мкс (без смены GM).</text>
</g>

<!-- Right: 4-timestamp exchange -->
<g transform="translate(398,58)" font-family="Arial,sans-serif">
  <rect x="0" y="0" width="438" height="456" rx="14" fill="#071e26" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="20" y="30" font-size="15.5" font-weight="800" fill="#5eead4">Обмен Sync / Delay_Req (2-step PTP)</text>

  <text x="72" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#ffedd5">Master</text>
  <line x1="72" y1="74" x2="72" y2="332" stroke="#fb923c" stroke-width="2.5"/>
  <text x="366" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#7dd3fc">Slave</text>
  <line x1="366" y1="74" x2="366" y2="332" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Sync t1 -> t2 -->
  <line x1="72" y1="102" x2="366" y2="136" stroke="#fb923c" stroke-width="3"/>
  <text x="219" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fdba74">1. Sync (отправка t1 → приём t2)</text>

  <!-- Follow_Up -->
  <line x1="72" y1="162" x2="366" y2="184" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="219" y="162" text-anchor="middle" font-size="12" fill="#cbd5e1">2. Follow_Up (передаёт точный t1)</text>

  <!-- Delay_Req t3 -> t4 -->
  <line x1="366" y1="224" x2="72" y2="258" stroke="#38bdf8" stroke-width="3"/>
  <text x="219" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7dd3fc">3. Delay_Req (отправка t3 → приём t4)</text>

  <!-- Delay_Resp -->
  <line x1="72" y1="290" x2="366" y2="314" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="219" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#5eead4">4. Delay_Resp (возвращает точный t4)</text>

  <rect x="20" y="346" width="398" height="94" rx="8" fill="#0b2438" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="219" y="370" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e0f2fe">Расчёт при симметричном пути:</text>
  <text x="219" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#5eead4">Задержка = ((t2 − t1) + (t4 − t3)) / 2</text>
  <text x="219" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#fdba74">Смещение (offset) = ((t2 − t1) − (t4 − t3)) / 2</text>
</g>
</svg>
