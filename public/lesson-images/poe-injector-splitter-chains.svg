<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 850" width="860" height="850" role="img" aria-labelledby="title desc">
<title id="title">Три варианта: IEEE PoE-инжектор, IEEE PoE-сплиттер, пассивная пара</title>
<desc id="desc">Синим показаны данные Ethernet, оранжевым питание IEEE PoE или DC, красным пассивное питание. Третий вариант имеет отдельные входы данных от коммутатора и DC от блока питания, допускается только при проверенной совместимости.</desc>
<defs><marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 10,5 0,10Z" fill="#38bdf8"/></marker><marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 10,5 0,10Z" fill="#fb923c"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 10,5 0,10Z" fill="#fb7185"/></marker></defs>
<rect width="860" height="850" rx="18" fill="#071522"/>
<text x="430" y="38" fill="#f1f5f9" font-family="Arial,sans-serif" font-weight="700" font-size="23" text-anchor="middle">Инжектор, сплиттер и пассивная пара</text>
<line x1="175" y1="62" x2="228" y2="62" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><text x="237" y="68" fill="#bae6fd" font-family="Arial,sans-serif" font-size="15">Ethernet</text>
<line x1="375" y1="62" x2="429" y2="62" stroke="#fb923c" stroke-width="4" marker-end="url(#arrOrange)"/><text x="440" y="68" fill="#fed7aa" font-family="Arial,sans-serif" font-size="15">IEEE PoE / DC</text>
<line x1="610" y1="62" x2="665" y2="62" stroke="#fb7185" stroke-width="4" stroke-dasharray="6,5" marker-end="url(#arrRed)"/><text x="675" y="68" fill="#fecdd3" font-family="Arial,sans-serif" font-size="15">Passive DC</text>

<rect x="22" y="89" width="816" height="217" rx="15" fill="#0c2539" stroke="#38bdf8" stroke-width="2"/>
<rect x="37" y="102" width="38" height="33" rx="8" fill="#0284c7"/><text x="56" y="125" fill="white" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">A</text>
<text x="90" y="125" fill="#e0f2fe" font-family="Arial" font-size="19" font-weight="700">IEEE-инжектор: добавляет питание</text>
<rect x="42" y="157" width="174" height="94" rx="10" fill="#10283b" stroke="#38bdf8"/><text x="129" y="184" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="16">Обычный свич</text><text x="129" y="207" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="14">без PoE</text>
<rect x="282" y="150" width="268" height="108" rx="10" fill="#152638" stroke="#fb923c" stroke-width="2"/><text x="416" y="175" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">IEEE PoE-инжектор</text><text x="416" y="199" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="14">Data IN  →  Data + Power OUT</text><text x="416" y="225" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="14">Питание инжектора от БП</text>
<rect x="632" y="157" width="187" height="94" rx="10" fill="#102d2a" stroke="#34d399"/><text x="726" y="184" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="700">PoE-камера</text><text x="726" y="208" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="14">IEEE PD</text>
<path d="M216 189H282" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><text x="249" y="175" text-anchor="middle" fill="#bae6fd" font-family="Arial" font-size="13">Data</text>
<path d="M550 180H632" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M550 224H632" stroke="#fb923c" stroke-width="4" marker-end="url(#arrOrange)"/>
<text x="41" y="283" fill="#cbd5e1" font-family="Arial" font-size="14">Проверка: 802.3af/at/bt, мощность инжектора и направление выходного порта.</text>

<rect x="22" y="320" width="816" height="217" rx="15" fill="#0b2930" stroke="#2dd4bf" stroke-width="2"/>
<rect x="37" y="333" width="38" height="33" rx="8" fill="#0d9488"/><text x="56" y="356" fill="white" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">B</text><text x="90" y="355" fill="#ccfbf1" font-family="Arial" font-size="19" font-weight="700">IEEE-сплиттер: разделяет данные и питание</text>
<rect x="41" y="386" width="205" height="100" rx="10" fill="#102d38" stroke="#fb923c"/><text x="143" y="416" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="700">PoE-коммутатор</text><text x="143" y="441" text-anchor="middle" fill="#fed7aa" font-family="Arial" font-size="14">IEEE PSE</text>
<rect x="320" y="381" width="237" height="110" rx="10" fill="#103035" stroke="#2dd4bf" stroke-width="2"/><text x="439" y="406" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="700">IEEE-сплиттер</text><text x="439" y="428" text-anchor="middle" fill="#99f6e4" font-family="Arial" font-size="14">PoE IN → Ethernet OUT</text><text x="439" y="452" text-anchor="middle" fill="#fdba74" font-family="Arial" font-size="14">DC/DC → 12 В DC OUT</text>
<rect x="649" y="385" width="169" height="103" rx="10" fill="#122b39" stroke="#38bdf8"/><text x="733" y="414" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="700">Камера без PoE</text><text x="733" y="438" text-anchor="middle" fill="#bae6fd" font-family="Arial" font-size="13">Ethernet</text><text x="733" y="459" text-anchor="middle" fill="#fed7aa" font-family="Arial" font-size="13">+ отдельные 12 В</text>
<path d="M246 416H320" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M246 456H320" stroke="#fb923c" stroke-width="4" marker-end="url(#arrOrange)"/>
<path d="M557 408H649" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M557 459H649" stroke="#fb923c" stroke-width="4" marker-end="url(#arrOrange)"/>
<text x="41" y="514" fill="#cbd5e1" font-family="Arial" font-size="14">Проверка: PoE-вход, DC-напряжение, ток, полярность, штекер и запас мощности.</text>

<rect x="22" y="550" width="816" height="278" rx="15" fill="#30131c" stroke="#fb7185" stroke-width="2"/>
<rect x="37" y="565" width="38" height="33" rx="8" fill="#be123c"/><text x="56" y="589" fill="white" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">C</text><text x="89" y="588" fill="#ffe4e6" font-family="Arial" font-size="19" font-weight="700">Пассивная пара: только совместимое оборудование</text>
<rect x="38" y="615" width="171" height="57" rx="9" fill="#162534" stroke="#38bdf8"/><text x="124" y="640" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="15">Обычный свич</text><text x="124" y="659" text-anchor="middle" fill="#bae6fd" font-family="Arial" font-size="13">Ethernet DATA</text>
<rect x="38" y="694" width="171" height="54" rx="9" fill="#352331" stroke="#fb7185"/><text x="124" y="716" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="15">Внешний DC БП</text><text x="124" y="738" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="13">например 12 В</text>
<rect x="259" y="624" width="175" height="111" rx="10" fill="#31212a" stroke="#fb7185"/><text x="346" y="649" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="700">Пассивный</text><text x="346" y="669" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="700">инжектор</text><text x="346" y="692" text-anchor="middle" fill="#bae6fd" font-family="Arial" font-size="13">Data IN</text><text x="346" y="712" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="13">+ DC IN</text>
<rect x="505" y="624" width="154" height="111" rx="10" fill="#31212a" stroke="#fb7185"/><text x="582" y="649" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="700">Пассивный</text><text x="582" y="669" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="700">сплиттер</text><text x="582" y="691" text-anchor="middle" fill="#bae6fd" font-family="Arial" font-size="13">Ethernet OUT</text><text x="582" y="712" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="13">DC OUT</text>
<rect x="711" y="637" width="106" height="87" rx="9" fill="#33232a" stroke="#fb7185"/><text x="764" y="661" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="700">Камера</text><text x="764" y="682" text-anchor="middle" fill="white" font-family="Arial" font-size="14">без PoE</text><text x="764" y="703" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="12">DC совместима</text>
<path d="M209 645H259" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M209 717H232V712H259" fill="none" stroke="#fb7185" stroke-dasharray="6 5" stroke-width="4" marker-end="url(#arrRed)"/>
<path d="M434 648H505" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M434 712H505" stroke="#fb7185" stroke-dasharray="6 5" stroke-width="4" marker-end="url(#arrRed)"/>
<path d="M659 653H711" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M659 706H711" stroke="#fb7185" stroke-dasharray="6 5" stroke-width="4" marker-end="url(#arrRed)"/>
<rect x="39" y="762" width="782" height="49" rx="9" fill="#5b1224" stroke="#f43f5e"/><text x="430" y="782" text-anchor="middle" fill="#ffe4e6" font-family="Arial" font-weight="700" font-size="16">ОПАСНО: нет обязательных IEEE detection и DC/DC</text><text x="430" y="802" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="13">Сначала проверь напряжение, полярность, контакты и потери на длинном кабеле.</text>
</svg>